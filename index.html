<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="outer">
    <div class="title">
        <h1>Rock Paper Scissor</h1>
    </div>

    <div class="score_board">
        <div class="human">
            <p>You</p>
            <p id="human_score"></p>
        </div>
        <div class="vs">
            <p>vs</p>
            <p>:</p>
        </div>
        <div class="computer">
            <p>computer</p>
            <p id="computer_score"></p>
        </div>
    </div>

    <div class="choice">
        <button id="rock" type="button">rock</button>
        <button id="paper" type="button">paper</button>
        <button id="scissor" type="button">scissor</button>
    </div>

    <div class="result">
        <div id="current_choice">
        <div class="display">
        <p>You chose: </p>
        <p id="human_choice"></p>
        </div>
        <div class="display">
        <p>computer chose: </p>
        <p id="computer_choice"></p>
        </div>
        </div>
        <p id="winner"></p>
    </div>
    </div>

    <dialog >
        <h2 id="msg"></h2>
        <p id="final_scores"></p>
        <button id="restart" type="button">restart</button>
    </dialog>

</body>
</html>
